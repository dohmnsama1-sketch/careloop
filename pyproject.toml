[project]
name = "careloop"
version = "1.1.0"
description = "CareLoop: a self-hosted MCP server (Streamable HTTP) that turns Alexa+ into a family care coordinator."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3", "uvicorn>=0.30"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
careloop = "careloop.server:main"
careloop-seed = "careloop.seed:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
careloop = ["ui/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
